<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-light: #ff6b81;
            --secondary: #2f3542;
            --light: #f1f2f6;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #eccc68;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--secondary);
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dfe4ea;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .input-field:focus {
            border-color: var(--primary-light);
            outline: none;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.2);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #ff3344;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .result-card {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        .result-positive {
            background-color: rgba(255, 71, 87, 0.1);
            border: 2px solid var(--danger);
            color: var(--danger);
        }

        .result-negative {
            background-color: rgba(46, 213, 115, 0.1);
            border: 2px solid var(--success);
            color: var(--success);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            color: var(--primary-light);
            cursor: help;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: var(--secondary);
            color: white;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--secondary);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Heart Disease Predictor</h1>
            <p class="subtitle">Enter your health details to assess your heart disease risk</p>
        </header>

        <div class="card">
            <form action="/predict" method="post">
                <div class="input-grid">
                    <div class="form-group">
                        <label for="age">Age (years)</label>
                        <input type="number" id="age" name="age" class="input-field" required min="1" max="120" placeholder="e.g. 45">
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender
                            <span class="tooltip">?
                                <span class="tooltiptext">0 = Female, 1 = Male</span>
                            </span>
                        </label>
                        <input type="number" id="gender" name="gender" class="input-field" required min="0" max="1" placeholder="0 or 1">
                    </div>

                    <div class="form-group">
                        <label for="cp">Chest Pain Type
                            <span class="tooltip">?
                                <span class="tooltiptext">0–Typical Angina, 1–Atypical Angina, 2–Non-anginal Pain, 3–Asymptomatic</span>
                            </span>
                        </label>
                        <input type="number" id="cp" name="cp" class="input-field" required min="0" max="3" placeholder="0 to 3">
                    </div>

                    <div class="form-group">
                        <label for="trestbps">Resting Blood Pressure (mm Hg)</label>
                        <input type="number" id="trestbps" name="trestbps" class="input-field" required min="80" max="200" placeholder="e.g. 120">
                    </div>

                    <div class="form-group">
                        <label for="chol">Cholesterol (mg/dl)</label>
                        <input type="number" id="chol" name="chol" class="input-field" required min="100" max="600" placeholder="e.g. 200">
                    </div>

                    <div class="form-group">
                        <label for="fbs">Fasting Blood Sugar > 120 mg/dl
                            <span class="tooltip">?
                                <span class="tooltiptext">1 = Yes, 0 = No</span>
                            </span>
                        </label>
                        <input type="number" id="fbs" name="fbs" class="input-field" required min="0" max="1" placeholder="0 or 1">
                    </div>

                    <div class="form-group">
                        <label for="restecg">Resting ECG
                            <span class="tooltip">?
                                <span class="tooltiptext">0–Normal, 1–ST-T Abnormality, 2–Left Ventricular Hypertrophy</span>
                            </span>
                        </label>
                        <input type="number" id="restecg" name="restecg" class="input-field" required min="0" max="2" placeholder="0 to 2">
                    </div>

                    <div class="form-group">
                        <label for="thalach">Max Heart Rate Achieved</label>
                        <input type="number" id="thalach" name="thalach" class="input-field" required min="60" max="220" placeholder="e.g. 150">
                    </div>

                    <div class="form-group">
                        <label for="exang">Exercise Induced Angina
                            <span class="tooltip">?
                                <span class="tooltiptext">1 = Yes, 0 = No</span>
                            </span>
                        </label>
                        <input type="number" id="exang" name="exang" class="input-field" required min="0" max="1" placeholder="0 or 1">
                    </div>

                    <div class="form-group">
                        <label for="oldpeak">ST Depression (Exercise)</label>
                        <input type="number" id="oldpeak" name="oldpeak" class="input-field" required min="0" step="0.1" placeholder="e.g. 1.5">
                    </div>

                    <div class="form-group">
                        <label for="slope">Slope of Peak Exercise ST
                            <span class="tooltip">?
                                <span class="tooltiptext">0–Upsloping, 1–Flat, 2–Downsloping</span>
                            </span>
                        </label>
                        <input type="number" id="slope" name="slope" class="input-field" required min="0" max="2" placeholder="0 to 2">
                    </div>

                    <div class="form-group">
                        <label for="ca">Major Vessels (Fluoroscopy)
                            <span class="tooltip">?
                                <span class="tooltiptext">Number of major vessels (0–3)</span>
                            </span>
                        </label>
                        <input type="number" id="ca" name="ca" class="input-field" required min="0" max="3" placeholder="0 to 3">
                    </div>

                    <div class="form-group">
                        <label for="thal">Thalassemia
                            <span class="tooltip">?
                                <span class="tooltiptext">3–Normal, 6–Fixed Defect, 7–Reversible Defect</span>
                            </span>
                        </label>
                        <input type="number" id="thal" name="thal" class="input-field" required min="3" max="7" placeholder="3, 6, or 7">
                    </div>
                </div>

                <button type="submit" class="btn">Predict Heart Disease Risk</button>
            </form>

            {% if prediction %}
                <div class="result-card {{ 'result-positive' if 'Positive' in prediction else 'result-negative' }}">
                    Result: {{ prediction }}
                </div>
            {% endif %}
        </div>

        <footer>
            <p>Note: This prediction is for informational purposes only. Consult a healthcare professional for medical advice.</p>
        </footer>
    </div>
</body>
</html>
